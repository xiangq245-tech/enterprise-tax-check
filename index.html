<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业法税风险体检 V2</title><meta name="description" content="30项企业资金、报销、发票与股东治理自查，生成资料复核报告。"><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#142b43;font:16px/1.65 system-ui,sans-serif}header{background:#112c46;color:white;padding:28px max(22px,calc((100vw - 1120px)/2))}header small{color:#a7d0ef}h1{font-size:28px;margin:6px 0}main{max-width:1120px;margin:24px auto;padding:0 20px}.intro,.card,aside{background:white;border:1px solid #d8e2ee;border-radius:12px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px}.profile{display:flex;gap:18px;flex-wrap:wrap}label{display:block}input,select,button{font:inherit;border:1px solid #b9cbdc;border-radius:7px;padding:10px}input,select{max-width:100%;background:white;color:#142b43}button{cursor:pointer;background:#173d60;color:white}button:disabled{background:#7b8b9a;cursor:not-allowed}.q{border-top:1px solid #e6edf5;padding:18px 0}.q:first-of-type{border-top:0}.options{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.options label{padding:7px 10px;border:1px solid #d7e3ef;border-radius:7px;cursor:pointer}.options label:has(input:checked){background:#e3f0fe;border-color:#235f92}.options input{accent-color:#235f92}aside{height:fit-content;position:sticky;top:16px}progress{width:100%;height:12px}#message{color:#824419}.muted{color:#53677b;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}.badge{font-weight:700;color:#173d60}.report-item{padding:15px 0;border-top:1px solid #dae4ef}#report h2{margin-top:0}a{color:#236091}@media(max-width:760px){.grid{display:block}aside{position:static}h1{font-size:24px}main{padding:0 12px}.card{padding:18px}}@media print{body{background:white}header,.intro,.grid,#message,.actions{display:none}main{max-width:none;margin:0;padding:0}#report{display:block!important;border:0}.report-item{break-inside:avoid}button{display:none}}</style></head><body><header><small>企业内部自查 · V2 体验版</small><h1>老板从公司拿钱，哪些事项需要复核？</h1><p>30 项自查，生成一份可交给财务和律师的资料清单。</p></header><main><section class="intro"><div class="profile"><label>企业名称（可不填）<br><input id="company" maxlength="80" placeholder="例如：某某有限公司"></label><label>企业类型<br><select id="type"><option>尚未确认</option><option>有限责任公司</option><option>股份有限公司</option><option>个人独资企业</option><option>合伙企业</option><option>其他</option></select></label></div><p class="muted">按实际情况选择。没有掌握资料请选“不清楚”；“不适用”表示该事项与企业无关。填写内容只在当前页面使用，刷新后清空。</p></section><div class="grid"><div id="questions"></div><aside><strong id="count"></strong><progress id="progress" max="30" value="0" aria-label="答题进度"></progress><p id="message" role="status"></p><div class="actions"><button id="generate" disabled>生成自查报告</button><button id="reset">重新填写</button></div><p class="muted">A / B / C 表示复核优先级，不表示违法程度。不按“是”的数量判断法律风险。</p></aside></div><section class="card" id="report" hidden aria-live="polite"></section></main><script>const questions = [{"id": 1, "group": "资金往来", "text": "股东借款跨年仍未清理", "priority": "B", "evidence": "借款协议、用途证明、银行流水、年度往来余额"}, {"id": 2, "group": "资金往来", "text": "年底还、年初又借，形成近额循环流水", "priority": "B", "evidence": "资金来源、还款流水、再次借款原因"}, {"id": 3, "group": "资金往来", "text": "其他应收款长期挂老板或关联人", "priority": "B", "evidence": "往来明细、实际受益人、逐笔用途"}, {"id": 4, "group": "资金往来", "text": "个人账户长期收公司货款", "priority": "B", "evidence": "收款流水、对应订单、入账和申报记录"}, {"id": 5, "group": "资金往来", "text": "个人代公司付款，缺少授权或报销闭环", "priority": "C", "evidence": "付款凭证、授权记录、偿还凭证"}, {"id": 6, "group": "资金往来", "text": "公司收入未入账，留在个人卡", "priority": "A", "evidence": "收入台账、账户流水、账簿、申报资料"}, {"id": 7, "group": "消费报销", "text": "老板私人餐饮或购物由企业报销", "priority": "B", "evidence": "支出清单、受益人身份、审批和账务记录"}, {"id": 8, "group": "消费报销", "text": "家庭水电、物业、家政等由企业承担", "priority": "B", "evidence": "经营使用资料、费用明细、分摊底稿"}, {"id": 9, "group": "消费报销", "text": "配偶或子女教育、医疗费用由企业承担", "priority": "B", "evidence": "受益人身份、任职记录、福利制度"}, {"id": 10, "group": "差旅招待", "text": "把个人旅游作为公务出差报销", "priority": "B", "evidence": "行程、任务、订单、工作成果"}, {"id": 11, "group": "差旅招待", "text": "出差时家属费用与公务费用混在一起", "priority": "B", "evidence": "同行人、订单、费用拆分底稿"}, {"id": 12, "group": "差旅招待", "text": "差旅缺少行程、任务或成果资料", "priority": "C", "evidence": "出差审批、往返行程、业务成果"}, {"id": 13, "group": "差旅招待", "text": "客户宴请只有发票，缺少业务记录", "priority": "C", "evidence": "宴请事由、业务关系、审批、付款资料"}, {"id": 14, "group": "差旅招待", "text": "所有餐费都记成业务招待费", "priority": "C", "evidence": "费用分类明细、业务用途、核算记录"}, {"id": 15, "group": "差旅招待", "text": "招待费未核对税前扣除限额", "priority": "C", "evidence": "年度收入、实际支出、申报计算底稿"}, {"id": 16, "group": "发票凭证", "text": "没有真实交易，购买发票用于冲成本", "priority": "A", "evidence": "发票、付款、交易资料；保留原始记录"}, {"id": 17, "group": "发票凭证", "text": "真实业务取得第三方或内容不符的发票", "priority": "B", "evidence": "实际交易方、合同、付款、换开沟通记录"}, {"id": 18, "group": "发票凭证", "text": "发票抬头、品名或金额错误仍入账", "priority": "C", "evidence": "原始发票、交易证明、更正处理记录"}, {"id": 19, "group": "发票凭证", "text": "只有发票，缺少付款和交付等业务证据", "priority": "C", "evidence": "合同、付款、验收或交付资料"}, {"id": 20, "group": "人员薪酬", "text": "亲属未实际工作却领取工资", "priority": "B", "evidence": "岗位、考勤、工作成果、工资和申报记录"}, {"id": 21, "group": "人员薪酬", "text": "亲属实际工作，但缺少任职和工作证据", "priority": "C", "evidence": "劳动或聘用文件、岗位、工作成果"}, {"id": 22, "group": "人员薪酬", "text": "工资、奖金、分红、借款、报销混记", "priority": "B", "evidence": "各类款项明细、决策、合同、入账记录"}, {"id": 23, "group": "车辆资产", "text": "企业车辆主要用于老板私人用途", "priority": "B", "evidence": "车辆权属、实际使用记录、费用清单"}, {"id": 24, "group": "车辆资产", "text": "企业车辆长期供家庭成员使用", "priority": "B", "evidence": "使用人身份、任职、公务行程、私人用途"}, {"id": 25, "group": "车辆资产", "text": "私车公用缺少协议、标准或行程记录", "priority": "C", "evidence": "使用协议、费用标准、公务行程"}, {"id": 26, "group": "车辆资产", "text": "私车全部油费、保险、维修由企业承担", "priority": "B", "evidence": "协议、费用明细、实际公务使用记录"}, {"id": 27, "group": "车辆资产", "text": "企业出资购买资产，却登记在个人名下", "priority": "A", "evidence": "产权登记、购置合同、付款、受益人身份"}, {"id": 28, "group": "股东治理", "text": "老板或实控人自己审批自己的报销", "priority": "C", "evidence": "章程、授权、审批流程、相关决策"}, {"id": 29, "group": "股东治理", "text": "股东查账或报销争议尚未处理", "priority": "B", "evidence": "企业类型、股东身份、请求文件、答复记录"}, {"id": 30, "group": "股东治理", "text": "公私账户和财产长期混在一起", "priority": "B", "evidence": "账户、财产清单、往来台账、债务情况"}];
function assess(answers){
 const yes=questions.filter(q=>answers[q.id]==='yes');
 const unknown=questions.filter(q=>answers[q.id]==='unknown');
 const missing=questions.filter(q=>!['yes','no','unknown','na'].includes(answers[q.id]));
 const level=yes.some(q=>q.priority==='A')?'A':yes.some(q=>q.priority==='B')?'B':yes.length?'C':null;
 return {yes,unknown,missing,level,complete:missing.length===0};
}
if(typeof module!=='undefined') module.exports={questions,assess};

const answers={};
const form=document.getElementById('questions');
const groups=[...new Set(questions.map(q=>q.group))];
for(const group of groups){const section=document.createElement('section');section.className='card';const h=document.createElement('h2');h.textContent=group;section.append(h);for(const q of questions.filter(q=>q.group===group)){const f=document.createElement('fieldset');f.className='q';f.style.border='0';const legend=document.createElement('legend');legend.textContent=String(q.id).padStart(2,'0')+' · '+q.text;f.append(legend);const choices=document.createElement('div');choices.className='options';for(const [value,label] of [['yes','是'],['no','否'],['unknown','不清楚'],['na','不适用']]){const l=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='q'+q.id;input.value=value;input.addEventListener('change',()=>{answers[q.id]=value;document.getElementById('report').hidden=true;update()});l.append(input,document.createTextNode(' '+label));choices.append(l)}f.append(choices);section.append(f)}form.append(section)}
function update(){const r=assess(answers),n=30-r.missing.length;document.getElementById('count').textContent=n+' / 30 项已完成';document.getElementById('progress').value=n;document.getElementById('generate').disabled=!r.complete;document.getElementById('message').textContent=r.complete?'可以生成报告。':'请完成全部问题；无法判断时选“不清楚”。'}
function add(parent,tag,txt,cls){const el=document.createElement(tag);el.textContent=txt;if(cls)el.className=cls;parent.append(el);return el}
document.getElementById('generate').onclick=()=>{const r=assess(answers);if(!r.complete)return;const out=document.getElementById('report');out.replaceChildren();add(out,'h2','企业法税风险自查报告');add(out,'p',(document.getElementById('company').value.trim()||'未填写企业名称')+' · '+document.getElementById('type').value+' · '+new Date().toLocaleDateString('zh-CN'));
const titles={A:'A 类 · 优先专项复核',B:'B 类 · 重点复核与整改',C:'C 类 · 常规资料与流程规范'};
add(out,'h3',r.level?titles[r.level]:'本轮未报告已确认事项');add(out,'p','已确认 '+r.yes.length+' 项；不清楚 '+r.unknown.length+' 项。数量仅反映事项广度。');
if(r.unknown.length)add(out,'p','存在信息缺口：结论为暂定，应先补查“不清楚”的事项。');
add(out,'p',r.level==='A'?'优先核对相关事项，保留原始资料，交由律师与税务专业人员结合实际事实复核。':r.level==='B'?'逐项整理金额、期间、受益人和证据，明确复核负责人及处理期限。':r.level==='C'?'完善授权、审批、凭证、分类和行程记录，按月或季度抽查。':'本轮回答不足以证明企业没有风险；仍应核对原始资料。');
for(const [heading,items] of [['已确认事项',r.yes],['待查明事项',r.unknown]]){if(!items.length)continue;add(out,'h3',heading);for(const q of items){const d=add(out,'div','','report-item');add(d,'strong',String(q.id).padStart(2,'0')+' · '+q.text);add(d,'p','准备资料：'+q.evidence);add(d,'p','记录金额与期间：________　负责人：________　复核期限：________','muted')}}
add(out,'h3','完整答题记录');for(const q of questions)add(out,'p',String(q.id).padStart(2,'0')+' '+q.text+'：'+({yes:'是',no:'否',unknown:'不清楚',na:'不适用'}[answers[q.id]]),'muted');
add(out,'p','本报告仅按自述信息整理复核优先级，不认定违法、犯罪、税额或责任。实际判断须结合企业类型、人员身份、业务、金额、期间、证据及届时有效规则。','muted');const b=add(out,'button','打印 / 保存为 PDF');b.onclick=()=>window.print();out.hidden=false;out.scrollIntoView({behavior:'smooth'})};
document.getElementById('reset').onclick=()=>{if(!confirm('清空本次填写内容？'))return;for(const k in answers)delete answers[k];document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);document.getElementById('company').value='';document.getElementById('type').selectedIndex=0;document.getElementById('report').hidden=true;update()};update();</script></body></html>
